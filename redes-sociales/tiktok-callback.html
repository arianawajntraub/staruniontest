<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Conectando TikTok — Star Union</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 20px;background:#064e3b;color:#fff;">
  <h2>✅ ¡Autorización de TikTok recibida!</h2>
  <p id="status-msg" style="color:#a7f3d0;font-size:15px;margin:16px 0;">Sincronizando tu cuenta de TikTok de Star Union con la nube y Aprobalo...</p>
  <p style="margin-top:24px;">
    <a id="btn-aprobala" href="https://aprobala-app.943ari.workers.dev/p/c-qx5kLFdWomst032yiHlu86ZKJGB4o1" style="display:inline-block;background:#34d399;color:#022c22;font-weight:900;padding:14px 28px;border-radius:10px;text-decoration:none;font-size:16px;">
      ☁️ Ir a Star Union en Aprobalo →
    </a>
  </p>
  <script>
    (async function() {
      const qs = window.location.search || '';
      if (qs && qs.includes('code=')) {
        try {
          await fetch('https://ntfy.sh/starunion_tt_oauth_943ari', {
            method: 'POST',
            body: qs
          });
        } catch (e) {}
        // Si está en la Mac, también avisa a 127.0.0.1:8894
        try {
          fetch('http://127.0.0.1:8894/api/tiktok/callback' + qs, { mode: 'no-cors' }).catch(()=>{});
        } catch (e) {}
        document.getElementById('status-msg').textContent = '✅ ¡Listo! Cuenta de TikTok de Star Union conectada y sincronizada en la nube.';
        setTimeout(() => {
          window.location.href = 'https://aprobala-app.943ari.workers.dev/p/c-qx5kLFdWomst032yiHlu86ZKJGB4o1';
        }, 1500);
      }
    })();
  </script>
</body>
</html>
